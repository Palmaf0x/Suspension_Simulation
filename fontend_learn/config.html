<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Dynamics - Configuration</title>
    <link rel="stylesheet" href="style_config.css">
</head>
<body class="config-page">
    <div class="container centered-content">
        <div class="logo-placeholder">Logo</div>
        <h2>Apex Dynamics</h2>

        <form action="loading.html" class="config-form">
            <div class="form-group">
                <label for="nassimi">nassimi</label>
                <input type="text" id="nassimi" placeholder="Predicted...">
            </div>

            <div class="form-group">
                <label for="raideur">raideur (k)</label>
                <input type="text" id="raideur" placeholder="Predicted...">
            </div>

            <div class="form-group">
                <label for="friction">friction (c)</label>
                <input type="text" id="friction" placeholder="Predicted...">
            </div>

            <button type="submit" class="btn-primary">Simulation -></button>
        </form>
    </div>
</body>
</html>
